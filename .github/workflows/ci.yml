name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify and package
        shell: bash
        run: sh ./gradlew check :cli:installDist --console=plain
      - name: Smoke test Unix launcher outside repository
        if: runner.os != 'Windows'
        shell: bash
        run: |
          launcher="$GITHUB_WORKSPACE/modules/cli/build/install/qutivex/bin/qutivex"
          cd "$RUNNER_TEMP"
          "$launcher" --version
          "$launcher" init smoke-demo
          test -f smoke-demo/qutivex.toml
      - name: Smoke test Windows launcher outside repository
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $launcher = Join-Path $env:GITHUB_WORKSPACE 'modules/cli/build/install/qutivex/bin/qutivex.bat'
          Set-Location $env:RUNNER_TEMP
          & $launcher --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $launcher init smoke-demo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path 'smoke-demo/qutivex.toml')) { throw 'Missing generated manifest' }
