name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          dotnet tool install --global wix
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          try { & wix eula accept wix7 2>&1 | Out-Null } catch {}

      - name: Run checks and integration tests
        run: .\gradlew.bat check :cli:installDist --console=plain

      - name: Build Windows MSI Package & Distribution Archives
        shell: pwsh
        run: |
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          $tagVersion = "${{ github.ref_name }}"
          if ($tagVersion -match '^v?(\d+\.\d+\.\d+.*)') {
              $tagVersion = $matches[1]
          } else {
              $tagVersion = "0.3.5"
          }
          Write-Host "Packaging Qutivex for version $tagVersion..."
          $env:QUTIVEX_VERSION = $tagVersion
          .\scripts\package-msi.ps1 -Version $tagVersion
          .\gradlew.bat packageDistributionArchives "-PqutivexVersion=$tagVersion"
          Remove-Item -Force -ErrorAction SilentlyContinue "dist/*tagVersion*"

      - name: Verify Release Artifacts
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}"
          if ($tagVersion -match '^v?(\d+\.\d+\.\d+.*)') {
              $tagVersion = $matches[1]
          } else {
              $tagVersion = "0.3.5"
          }
          if (-not (Test-Path "dist/qutivex-x64.msi")) { throw "Missing dist/qutivex-x64.msi" }
          if (-not (Test-Path "dist/qutivex-x64.msi.sha256")) { throw "Missing dist/qutivex-x64.msi.sha256" }
          if (-not (Test-Path "dist/qutivex-$tagVersion.tar.gz")) { throw "Missing dist/qutivex-$tagVersion.tar.gz" }
          if (-not (Test-Path "dist/qutivex-$tagVersion.zip")) { throw "Missing dist/qutivex-$tagVersion.zip" }
          Write-Host "Artifacts verified successfully:"
          Get-Item dist/* | Select-Object Name, Length

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qutivex-release-artifacts
          path: |
            dist/qutivex-x64.msi
            dist/qutivex-x64.msi.sha256
            dist/qutivex-*.tar.gz
            dist/qutivex-*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/qutivex-x64.msi
            dist/qutivex-x64.msi.sha256
            dist/qutivex-*.tar.gz
            dist/qutivex-*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
