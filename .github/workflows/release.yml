name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX Toolset
        run: |
          dotnet tool install --global wix
          wix eula accept wix7

      - name: Run checks and integration tests
        run: .\gradlew.bat check :cli:installDist --console=plain

      - name: Build Windows MSI Package
        run: .\gradlew.bat packageWindowsMsi --console=plain

      - name: Verify Release Artifacts
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/qutivex-x64.msi")) { throw "Missing dist/qutivex-x64.msi" }
          if (-not (Test-Path "dist/qutivex-x64.msi.sha256")) { throw "Missing dist/qutivex-x64.msi.sha256" }
          Write-Host "Artifacts verified:"
          Get-Item dist/* | Select-Object Name, Length

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qutivex-windows-msi
          path: |
            dist/qutivex-x64.msi
            dist/qutivex-x64.msi.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/qutivex-x64.msi
            dist/qutivex-x64.msi.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
